<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-label="NewsCraft AI" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E78FF"/>
      <stop offset="1" stop-color="#FF7EB3"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a6e" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1a6e" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="c"><rect x="2" y="2" width="556" height="216" rx="22"/></clipPath>
  </defs>
  <rect x="2" y="2" width="556" height="216" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <circle r="75" fill="#ffffff" opacity="0.30" filter="url(#blur)" cx="500" cy="30">
      <animate attributeName="cx" values="500;410;500" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;100;30" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="55" fill="#ffffff" opacity="0.18" filter="url(#blur)" cx="40" cy="215">
      <animate attributeName="cx" values="40;150;40" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect x="2" y="2" width="556" height="216" fill="url(#shade)"/>
  </g>
  <rect x="2" y="2" width="556" height="216" rx="22" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="90 700" stroke-linecap="round" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-790" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="36" y="66" font-size="34" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">📰</text>
  <text x="36" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">NewsCraft AI</text>
  <text x="36" y="134" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ffffff" fill-opacity="0.85">NewsCraft_AI</text>
  <text x="36" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff">AI-powered newsletter automation project.</text>

  <rect x="30" y="180" width="142" height="30" rx="15" fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="48" cy="195" r="6" fill="#f1e05a">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="201" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3b2a8c">JavaScript</text>

  <text x="524" y="201" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">View repo →
    <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.8s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
